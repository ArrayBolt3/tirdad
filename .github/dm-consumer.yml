## AI-Assisted

## Per-repo parameter overrides. Read at workflow runtime by the
## reusable workflows in developer-meta-files. Top-level keys
## mirror the consumer-template basename without the
## 'consumer-' prefix.
##
## Spec:
## https://github.com/org-ai-assisted/developer-meta-files/blob/master/agents/github-actions-consumer-templates.md

codeql-cpp:
  ## tirdad is an out-of-tree Linux kernel module. build-mode=manual
  ## requires an actual kbuild compile so the CodeQL c-cpp extractor
  ## traces module/tirdad.c. codeql-build.sh installs matching kernel
  ## headers and drives the repo Makefile. No prepare-command: the
  ## source uses clean '.c' names (no genmkfile '#tag' suffix).
  build-command: "ci/codeql-build.sh"

coverity:
  ## Coverity Scan project + the canonical repo allowed to submit
  ## (mirror runs skip the heavy steps via the canonical-repos gate).
  project-name: "org-ai-assisted-tirdad"
  canonical-repos: "org-ai-assisted/tirdad"
  ## tirdad is an out-of-tree kernel module: cov-build must wrap the
  ## real kbuild compile or cov-int captures zero units (false green).
  ## coverity-build.sh installs the same kernel headers as the CodeQL
  ## lane, drives the repo Makefile under './cov-analysis/bin/cov-build
  ## --dir cov-int', and hard-fails on a zero-unit capture. The kernel
  ## header install lives inside the script (mirroring codeql-build.sh),
  ## so no apt-packages key is needed here.
  build-command: "ci/coverity-build.sh"
